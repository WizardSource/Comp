[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "komp"
version = "0.1.0.dev0"
description = "KOMP: KURN's math on a minimal Triton fork (upstream Triton + triton.language.extra.kurn)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["kurn", "triton==3.8.0", "torch", "numpy"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
komp = "komp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"src/komp/cli.py" = ["E501"]  # report lines

[tool.ruff.lint.isort]
known-first-party = ["komp", "kurn"]
